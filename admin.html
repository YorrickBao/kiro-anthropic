<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kiro-anthropic · admin</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --line: #262b36; --fg: #e6e9ef;
    --muted: #8b93a7; --accent: #6ea8fe; --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 18px 24px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .ver { color: var(--muted); font-size: 12px; }
  header .update-badge {
    font-size: 11px; color: var(--bg); background: var(--ok); cursor: pointer;
    padding: 2px 8px; border-radius: 999px; font-weight: 600; user-select: none;
  }
  header .update-badge:hover { filter: brightness(1.1); }
  header .spacer { flex: 1; }
  header .updated { color: var(--muted); font-size: 12px; }
  .wrap { padding: 20px 24px; max-width: 1100px; margin: 0 auto; display: grid; gap: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 14px; }
  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; word-break: break-all; }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .pill.ok { color: var(--ok); border-color: #234; } .pill.warn { color: var(--warn); } .pill.err { color: var(--err); }
  .bar { height: 10px; border-radius: 6px; background: #222836; overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #a78bfa); }
  .big { font-size: 20px; font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { background: #12151c; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat .lbl { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.ctr, th.ctr { text-align: center; }
  .th-hint { color: var(--muted); font-size: 10px; font-weight: 400; }
  pre { background: #0b0d11; border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; font-size: 12px; }
  .err-box { color: var(--err); }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .login-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .login-form .field { display: flex; flex-direction: column; gap: 4px; }
  .login-form label { color: var(--muted); font-size: 12px; }
  .login-form input {
    background: #12151c; border: 1px solid var(--line); border-radius: 6px;
    color: var(--fg); padding: 7px 9px; min-width: 220px; font-size: 13px;
  }
  button {
    background: var(--accent); color: #0b0d11; border: 0; border-radius: 6px;
    padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.danger { background: transparent; color: var(--err); border: 1px solid var(--line); padding: 4px 10px; font-weight: 500; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); padding: 4px 10px; font-weight: 500; }
  button.copy { background: transparent; color: var(--muted); border: 0; padding: 0 6px; margin-left: 6px; cursor: pointer; font-size: 13px; }
  button.edit { background: transparent; color: var(--muted); border: 0; padding: 0 6px; margin-left: 4px; cursor: pointer; font-size: 12px; }
  button.edit:hover { color: var(--accent); }
  button.copy:hover { color: var(--accent); }
  tr.expandable { cursor: pointer; }
  tr.expandable:hover { background: rgba(110,168,254,.06); }
  .caret { display: inline-block; width: 12px; color: var(--muted); font-size: 10px; margin-right: 4px; transition: transform .15s; }
  tr.detail > td { background: #0e1015; }
  tr.detail .kv { grid-template-columns: 90px 1fr; }
  /* account cards */
  .accounts { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .acct { position: relative; background: #12151c; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  @property --flow-angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  .acct.enabled { border-color: transparent; }
  .acct.enabled::before {
    content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: conic-gradient(from var(--flow-angle), #ff2d55, #ff9500, #ffd60a, #34c759, #00c7be, #0a84ff, #bf5af2, #ff2d55);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: flow-border 4s linear infinite;
  }
  @keyframes flow-border { to { --flow-angle: 360deg; } }
  @media (prefers-reduced-motion: reduce) { .acct.enabled::before { animation: none; } }
  .acct-btns { display: inline-flex; gap: 8px; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .acct:hover .acct-btns, .acct:focus-within .acct-btns { opacity: 1; pointer-events: auto; }
  .switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-size: 12.5px; }
  .switch input { appearance: none; -webkit-appearance: none; width: 34px; height: 18px; border-radius: 999px;
    background: #2a2f3a; border: 1px solid var(--line); position: relative; margin: 0; transition: background .15s; cursor: pointer; }
  .switch input::after { content: ""; position: absolute; top: 1px; left: 1px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--fg); transition: transform .15s; }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { transform: translateX(16px); }
  .switch input:disabled { opacity: .5; cursor: default; }
  .acct .top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .acct .email { font-weight: 600; word-break: break-all; }
  .acct .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .acct .meta { display: grid; grid-template-columns: 88px 1fr; gap: 4px 10px; font-size: 12.5px; }
  .acct .meta dt { color: var(--muted); }
  .acct .meta dd { margin: 0; word-break: break-all; }
  /* loading state: skeleton cards + inline status bar */
  .acct.skeleton { min-height: 180px; }
  .acct.skeleton .sk-line {
    height: 12px; border-radius: 6px; margin: 10px 0;
    background: linear-gradient(90deg, #1c2029 25%, #262b36 37%, #1c2029 63%);
    background-size: 400% 100%;
    animation: skeleton-pulse 1.4s ease infinite;
  }
  .acct.skeleton .sk-line.w70 { width: 70%; }
  .acct.skeleton .sk-line.w90 { width: 90%; }
  .acct.skeleton .sk-line.w40 { width: 40%; }
  @keyframes skeleton-pulse { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  .status-bar { display: none; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .status-bar.show { display: flex; }
  .status-bar.err { color: var(--err); }
  .spinner { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* popover */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 10; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; max-width: 820px; width: calc(100% - 40px); max-height: 80vh; overflow: auto; }
  .modal .close { float: right; }
  .md { font-size: 12.5px; color: var(--fg); line-height: 1.55; }
  .md .md-h { color: var(--fg); font-weight: 600; letter-spacing: 0; text-transform: none; margin: 12px 0 6px; }
  .md h4.md-h { font-size: 13px; }
  .md h5.md-h, .md h6.md-h { font-size: 12.5px; color: var(--muted); }
  .md .md-p { margin: 6px 0; }
  .md .md-ul { margin: 6px 0; padding-left: 20px; }
  .md .md-ul li { margin: 2px 0; }
  .md code { background: #0b0d11; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 12px; }
  .md a { color: var(--accent); }
  .md strong { font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>kiro-anthropic</h1>
  <span class="ver" id="ver"></span>
  <span class="update-badge" id="update-badge" title="" style="display:none">↑ 新版本</span>
  <span class="spacer"></span>
  <span class="updated" id="updated">加载中…</span>
</header>
<div class="wrap">
  <section class="card">
    <h2>多账号登录（企业 IdC）</h2>
    <div class="login-form">
      <div class="field"><label for="login-starturl">Start URL</label>
        <input id="login-starturl" type="text" placeholder="https://your-org.awsapps.com/start" /></div>
      <div class="field"><label for="login-region">Region</label>
        <input id="login-region" type="text" value="us-east-1" /></div>
      <div class="field"><label for="login-label">备注（可选）</label>
        <input id="login-label" type="text" placeholder="团队 A / 生产" /></div>
      <button id="login-btn" type="button">开始登录</button>
      <button id="import-btn" type="button" style="background:transparent;color:var(--accent);border:1px solid var(--line)">导入本机凭据</button>
      <span id="login-msg" class="muted"></span>
    </div>
    <p class="muted" style="font-size:12px;margin-top:10px">
      登录会在浏览器打开 AWS 授权页，完成后凭据保存在服务端。远程部署请通过 SSH 隧道访问本页
      (<code>ssh -L 27890:localhost:27890 &lt;server&gt;</code>)，以便授权回跳到本机。所有账号参与请求负载均衡。
    </p>
  </section>
  <section class="card">
    <h2 style="display:flex;align-items:center;gap:10px">账号（启用 <span id="acct-enabled">0</span> / 共 <span id="acct-count">0</span>）
      <span style="flex:1"></span>
      <button id="export-btn" class="ghost" type="button" style="text-transform:none;font-size:12px" title="导出全部号池凭据为 JSON 文件，用于迁移到其他服务器">导出号池</button>
      <button id="import-file-btn" class="ghost" type="button" style="text-transform:none;font-size:12px" title="从导出的 JSON 文件导入号池凭据（按身份合并去重）">导入号池</button>
      <button id="refresh-all-btn" class="ghost" type="button" style="text-transform:none;font-size:12px">刷新全部令牌</button>
      <input id="import-file-input" type="file" accept="application/json,.json" style="display:none" />
    </h2>
    <span id="refresh-all-msg" class="muted" style="font-size:12px"></span>
    <div class="status-bar" id="acct-status"><span class="spinner"></span><span id="acct-status-text">正在加载账号额度…</span></div>
    <div class="accounts" id="accounts"></div>
  </section>
</div>

<div class="modal-backdrop" id="models-modal">
  <div class="modal">
    <button class="ghost close" id="models-close" type="button">关闭</button>
    <h2 style="text-transform:none;font-size:15px;color:var(--fg);margin-top:0">可用模型</h2>
    <div id="models-body"></div>
  </div>
</div>

<div class="modal-backdrop" id="update-modal">
  <div class="modal">
    <button class="ghost close" id="update-close" type="button">关闭</button>
    <h2 style="text-transform:none;font-size:15px;color:var(--fg);margin-top:0">有新版本可更新</h2>
    <div id="update-body"></div>
  </div>
</div>

<script>
const REFRESH_MS = 15000;
const UPDATE_CHECK_MS = 30 * 60 * 1000; // idle re-check cadence; backend caches too
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtNum = (n) => (n == null) ? "—" : Number(n).toLocaleString(undefined, {maximumFractionDigits: 2});
const fmtCtx = (n) => {
  if (!n) return "?";
  if (n >= 1e6) return (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + "M";
  if (n >= 1e3) return Math.round(n / 1e3) + "K";
  return String(n);
};
const fmtDate = (s) => { if (!s) return "—"; const d = new Date(s); return isNaN(d) ? esc(s) : d.toLocaleString(); };

let latestModels = [];
let lastUpdateCheck = 0;
let loaded = false; // whether the first status poll has completed successfully

// setStatusBar toggles the inline loading/error indicator above the account grid.
function setStatusBar(text, isErr) {
  const bar = $("acct-status"), txt = $("acct-status-text");
  if (!text) { bar.classList.remove("show", "err"); return; }
  txt.textContent = text;
  bar.classList.toggle("err", !!isErr);
  bar.classList.add("show");
}

// renderSkeleton paints placeholder account cards while the first status poll is
// in flight, so the panel is never blank. It mirrors the .accounts grid layout.
function renderSkeleton() {
  const card = `<div class="acct skeleton">
    <div class="sk-line w70"></div><div class="sk-line w40"></div>
    <div class="sk-line w90"></div><div class="sk-line w90"></div>
    <div class="sk-line w70"></div>
  </div>`;
  $("accounts").innerHTML = card.repeat(3);
}

// checkUpdate polls the backend (which caches the GitHub result) and shows a
// header badge when a newer release exists. Failures are silent: a version
// check must never disrupt the page.
async function checkUpdate() {
  lastUpdateCheck = Date.now();
  try {
    const res = await fetch("/api/update.json", { cache: "no-store" });
    if (!res.ok) return;
    const d = await res.json();
    const badge = $("update-badge");
    if (d && d.update_available && Array.isArray(d.releases) && d.releases.length) {
      const cur = d.current ? (d.current.startsWith("v") ? d.current : "v" + d.current) : "";
      const latest = d.latest || (d.releases[0] && d.releases[0].tag) || "";
      badge.title = `当前 ${cur}，最新 ${latest}，点击查看变更`;
      badge.textContent = `↑ ${latest}`;
      badge.style.display = "";
      badge.onclick = () => openUpdate(d);
    } else {
      badge.style.display = "none";
      badge.onclick = null;
    }
  } catch (e) { /* silent */ }
}

// renderMarkdown turns a subset of Markdown (as produced by git-cliff release
// notes) into HTML. It escapes the source first, then applies formatting only to
// the already-escaped text, so there is no injection surface. Supported: ATX
// headings, unordered lists, **bold** / *italic*, `inline code`, and [text](url)
// links (http/https only).
function renderMarkdown(src) {
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
             (_, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`)
    .replace(/\*\*([^*]+)\*\*/g, (_, b) => `<strong>${b}</strong>`)
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, (_, p, i) => `${p}<em>${i}</em>`);

  const lines = String(src ?? "").split(/\r?\n/);
  const out = [];
  let inList = false;
  const closeList = () => { if (inList) { out.push("</ul>"); inList = false; } };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, "");
    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    const li = /^\s*[-*]\s+(.*)$/.exec(line);
    if (h) {
      closeList();
      const level = Math.min(6, h[1].length + 2); // ## → h4, keeps modal hierarchy calm
      out.push(`<h${level} class="md-h">${inline(h[2])}</h${level}>`);
    } else if (li) {
      if (!inList) { out.push('<ul class="md-ul">'); inList = true; }
      out.push(`<li>${inline(li[1])}</li>`);
    } else if (line.trim() === "") {
      closeList();
    } else {
      closeList();
      out.push(`<p class="md-p">${inline(line)}</p>`);
    }
  }
  closeList();
  return out.join("");
}

// openUpdate renders the aggregated release notes (newest first) into the modal.
// Bodies are rendered as a safe Markdown subset via renderMarkdown, which escapes
// before formatting, so there is no injection surface.
function openUpdate(d) {
  const parts = (d.releases || []).map(r => {
    const when = r.published_at ? ` · ${fmtDate(r.published_at)}` : "";
    const title = esc(r.name && r.name !== r.tag ? `${r.tag} — ${r.name}` : r.tag);
    const body = (r.body || "").trim();
    const notes = body ? `<div class="md" style="margin-top:6px">${renderMarkdown(body)}</div>`
                       : `<div class="muted" style="font-size:12px;margin-top:6px">（无说明）</div>`;
    const link = r.html_url ? ` <a href="${esc(r.html_url)}" target="_blank" rel="noopener" style="color:var(--accent);font-size:12px">在 GitHub 查看</a>` : "";
    return `<div style="padding:10px 0;border-top:1px solid var(--line)">
      <div style="font-size:13px;font-weight:600;color:var(--accent)">${title}<span class="muted" style="font-weight:400">${when}</span>${link}</div>
      ${notes}
    </div>`;
  }).join("");
  $("update-body").innerHTML =
    `<p class="muted" style="font-size:12px;margin:0 0 4px">运行 <code>kiro-anthropic upgrade</code> 升级到最新版本。</p>${parts}`;
  $("update-modal").classList.add("open");
}

function expiryPill(state, secs) {
  const cls = state === "valid" ? "ok" : (state === "expiring soon" ? "warn" : (state === "unknown" ? "" : "err"));
  let txt = state || "—";
  if (typeof secs === "number") {
    const s = Math.max(0, secs), h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
    txt += ` · ${h>0? h+"h ":""}${m}m`;
  }
  return `<span class="pill ${cls}">${esc(txt)}</span>`;
}

function usageHtml(u) {
  if (!u) return '<span class="muted">额度：—</span>';
  if (u.error) return `<div class="err-box" style="font-size:12px">额度获取失败: ${esc(u.error)}</div>`;
  let html = "";
  if (u.subscription_title || u.subscription_type)
    html += `<div style="margin:8px 0"><span class="pill ok">${esc(u.subscription_title || u.subscription_type)}</span></div>`;
  const c = u.credit;
  if (c) {
    const pct = c.limit > 0 ? Math.max(0, (c.used / c.limit) * 100) : 0;
    const barPct = Math.min(100, pct);
    html += `<div class="grid2">
      <div class="stat"><div class="lbl">剩余</div><div class="big">${fmtNum(c.remaining)}</div><div class="muted">credits</div></div>
      <div class="stat"><div class="lbl" style="display:flex;justify-content:space-between"><span>已用 / 总</span><span>${Math.round(pct)}%</span></div><div class="big">${fmtNum(c.used)} <span class="muted">/ ${fmtNum(c.limit)}</span></div>
        <div class="bar"><span style="width:${barPct.toFixed(1)}%"></span></div></div>
    </div>
    <div class="muted" style="font-size:12px;margin-top:6px">重置：${fmtDate(u.reset_at)}${c.free_trial_active ? " · 试用生效中" : ""}</div>`;
  }
  return html;
}

function renderAccounts(accounts) {
  const el = $("accounts");
  $("acct-count").textContent = accounts ? accounts.length : 0;
  $("acct-enabled").textContent = accounts ? accounts.filter(a => !a.disabled).length : 0;
  if (!accounts || !accounts.length) {
    el.innerHTML = '<span class="muted">尚无账号。请在上方登录或导入本机凭据。</span>';
    return;
  }
  el.innerHTML = accounts.map(a => `<div class="acct${a.disabled ? "" : " enabled"}">
    <div class="top">
      <span class="email">${esc(a.email || "(无邮箱)")}</span>
      <span class="spacer" style="flex:1"></span>
      ${expiryPill(a.expiry_state, a.expires_in_seconds)}
    </div>
    <dl class="meta">
      <dt>备注</dt><dd>${esc(a.label || "—")}<button class="edit" data-edit="${esc(a.id)}" data-label="${esc(a.label || "")}" type="button" title="修改备注">✎</button></dd>
      <dt>Provider</dt><dd>${esc(a.provider || "—")} <span class="muted">${esc(a.auth_method || "")}</span></dd>
      <dt>Region</dt><dd>${esc(a.region || "—")}</dd>
      <dt>profileArn</dt><dd style="font-size:12px">${esc(a.profile_arn || "—")}</dd>
      <dt>userId</dt><dd style="font-size:12px">${esc(a.user_id || "—")}</dd>
      <dt>Token</dt><dd><code>${esc(a.access_token || "—")}</code></dd>
    </dl>
    ${usageHtml(a.usage)}
    <div class="actions">
      <label class="switch" title="是否参与号池负载均衡">
        <input type="checkbox" data-toggle="${esc(a.id)}" ${a.disabled ? "" : "checked"} />
        <span>${a.disabled ? "停用" : "启用"}</span>
      </label>
      <span style="flex:1"></span>
      <span class="acct-btns">
        <button class="ghost" data-models type="button">模型</button>
        <button class="ghost" data-refresh="${esc(a.id)}" type="button">刷新令牌</button>
        <button class="ghost" data-refresh-id="${esc(a.id)}" type="button">刷新身份</button>
        <button class="danger" data-del="${esc(a.id)}" type="button">删除</button>
      </span>
    </div>
  </div>`).join("");
  el.querySelectorAll("button[data-del]").forEach(b => b.addEventListener("click", () => deleteAccount(b.dataset.del)));
  el.querySelectorAll("button[data-edit]").forEach(b => b.addEventListener("click", () => editLabel(b.dataset.edit, b.dataset.label)));
  el.querySelectorAll("button[data-models]").forEach(b => b.addEventListener("click", openModels));
  el.querySelectorAll("button[data-refresh]").forEach(b => b.addEventListener("click", () => refreshAccount(b.dataset.refresh, b)));
  el.querySelectorAll("button[data-refresh-id]").forEach(b => b.addEventListener("click", () => refreshIdentity(b.dataset.refreshId, b)));
  el.querySelectorAll("input[data-toggle]").forEach(b => b.addEventListener("change", () => toggleAccount(b.dataset.toggle, b.checked, b)));
}

function openModels() {
  const body = $("models-body");
  if (!latestModels || !latestModels.length) {
    body.innerHTML = '<span class="muted">无模型信息。</span>';
  } else {
    const hasDetail = latestModels.some(m => m.description || (m.supported_input_types && m.supported_input_types.length) || (m.prompt_caching && m.prompt_caching.supported));
    const hasStatus = latestModels.some(m => m.status);
    const rows = latestModels.map((m, i) => {
      const eff = m.capabilities && m.capabilities.effort;
      let effTxt = "—";
      if (eff && eff.supported) effTxt = ["low","medium","high","xhigh","max"].filter(l => eff[l]).join(" / ") || "yes";
      let rateTxt = "—";
      if (m.rate_multiplier) rateTxt = `<span class="pill">${m.rate_multiplier}x ${esc(m.rate_unit || "credit")}</span>`;
      let ctxTxt = "—";
      if (m.max_input_tokens || m.max_tokens) {
        ctxTxt = `${fmtCtx(m.max_input_tokens)} / ${fmtCtx(m.max_tokens)}`;
      }
      const isActive = (m.status || "").toUpperCase() === "ACTIVE";
      let statusTxt = "—";
      if (m.status) statusTxt = isActive
        ? `<span class="pill ok">${esc(m.status)}</span>`
        : `<span class="pill">${esc(m.status)}</span>`;
      const expandable = hasDetail && (m.description || (m.supported_input_types && m.supported_input_types.length) || (m.prompt_caching && m.prompt_caching.supported));
      const marker = expandable ? `<span class="caret" data-expand="${i}">▶</span>` : "";
      // Detail row content
      let detailCells = [];
      if (m.description) detailCells.push(`<dt>描述</dt><dd>${esc(m.description)}</dd>`);
      if (m.supported_input_types && m.supported_input_types.length) detailCells.push(`<dt>输入类型</dt><dd>${esc(m.supported_input_types.join(" / "))}</dd>`);
      if (m.prompt_caching && m.prompt_caching.supported) detailCells.push(`<dt>缓存</dt><dd><span class="pill ok">Prompt Caching</span></dd>`);
      const mainRow = `<tr class="mrow${expandable ? " expandable" : ""}" ${expandable ? `data-idx="${i}"` : ""}>
        <td style="white-space:nowrap">${marker}<code>${esc(m.id)}</code><button class="copy" data-copy="${esc(m.id)}" type="button" title="复制">⧉</button></td>
        <td>${esc(m.display_name || "")}</td>
        <td class="num">${ctxTxt}</td>
        <td class="ctr">${rateTxt}</td>
        <td>${esc(effTxt)}</td>
        ${hasStatus ? `<td class="ctr">${statusTxt}</td>` : ""}
      </tr>`;
      const detailRow = expandable ? `<tr class="detail" id="detail-${i}" style="display:none"><td colspan="${hasStatus ? 6 : 5}"><dl class="kv">${detailCells.join("")}</dl></td></tr>` : "";
      return mainRow + detailRow;
    }).join("");
    const statusHdr = hasStatus ? '<th class="ctr">状态</th>' : "";
    body.innerHTML = `<table><thead><tr><th>模型 ID</th><th>名称</th><th class="num">上下文窗口 <span class="th-hint">输入 / 输出</span></th><th class="ctr">倍率</th><th>Effort</th>${statusHdr}</tr></thead><tbody>${rows}</tbody></table>`;
    body.querySelectorAll("button.copy").forEach(b => b.addEventListener("click", () => copyText(b.dataset.copy, b)));
    body.querySelectorAll("[data-idx]").forEach(r => r.addEventListener("click", () => {
      const idx = r.dataset.idx;
      const d = $("detail-" + idx);
      const c = r.querySelector(".caret");
      if (d.style.display === "none") { d.style.display = ""; c.textContent = "▼"; } else { d.style.display = "none"; c.textContent = "▶"; }
    }));
  }
  $("models-modal").classList.add("open");
}

async function copyText(s, btn) {
  try {
    await navigator.clipboard.writeText(s);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = s; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (_) {}
    document.body.removeChild(ta);
  }
  if (btn) { const t = btn.textContent; btn.textContent = "✓"; setTimeout(() => { btn.textContent = t; }, 900); }
}

async function deleteAccount(id) {
  if (!id || !confirm("确定删除该账号凭据？")) return;
  try {
    const res = await fetch("/api/accounts/delete", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id })
    });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error((d.error && d.error.message) || ("HTTP " + res.status)); }
    tick();
  } catch (e) { alert("删除失败: " + e.message); }
}

async function editLabel(id, current) {
  if (!id) return;
  const label = prompt("修改备注：", current || "");
  if (label === null) return;
  try {
    const res = await fetch("/api/accounts/label", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, label })
    });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error((d.error && d.error.message) || ("HTTP " + res.status)); }
    tick();
  } catch (e) { alert("修改失败: " + e.message); }
}

async function startLogin() {
  const btn = $("login-btn"), msg = $("login-msg");
  const start_url = $("login-starturl").value.trim();
  const region = $("login-region").value.trim() || "us-east-1";
  const label = $("login-label").value.trim();
  if (!start_url) { msg.innerHTML = '<span class="err-box">请填写 Start URL</span>'; return; }
  btn.disabled = true; msg.textContent = "正在注册客户端…";
  try {
    const res = await fetch("/api/login/start", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ start_url, region, label })
    });
    const d = await res.json();
    if (!res.ok) throw new Error((d.error && d.error.message) || ("HTTP " + res.status));
    msg.innerHTML = '已在新窗口打开授权页，完成后返回本页会自动刷新。';
    window.open(d.authorize_url, "_blank", "noopener");
  } catch (e) {
    msg.innerHTML = `<span class="err-box">登录失败: ${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
}

async function importLocal() {
  const btn = $("import-btn"), msg = $("login-msg");
  btn.disabled = true; msg.textContent = "正在读取本机凭据…";
  try {
    const res = await fetch("/api/accounts/import", { method: "POST" });
    const d = await res.json();
    if (!res.ok) throw new Error((d.error && d.error.message) || ("HTTP " + res.status));
    msg.textContent = d.already_present ? "该凭据已在账号列表中（已刷新）。" : "已导入本机凭据。";
    tick();
  } catch (e) {
    msg.innerHTML = `<span class="err-box">导入失败: ${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
}

async function refreshAccount(id, btn) {
  if (!id) return;
  const orig = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "刷新中…"; }
  try {
    const res = await fetch("/api/accounts/refresh", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id })
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((d.error && d.error.message) || ("HTTP " + res.status));
    const r = (d.results && d.results[0]) || {};
    if (r.ok === false) throw new Error(r.error || "刷新失败");
    await tick();
  } catch (e) {
    alert("刷新失败: " + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = orig; }
  }
}

async function refreshIdentity(id, btn) {
  if (!id) return;
  const orig = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "解析中…"; }
  try {
    const res = await fetch("/api/accounts/refresh-identity", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id })
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((d.error && d.error.message) || ("HTTP " + res.status));
    await tick();
  } catch (e) {
    alert("刷新身份失败: " + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = orig; }
  }
}

async function toggleAccount(id, enable, cb) {
  if (!id) return;
  // `enable` is the checkbox's new (checked) state. The backend takes the
  // inverse: disabled = !enable.
  if (cb) cb.disabled = true;
  try {
    const res = await fetch("/api/accounts/disable", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, disabled: !enable })
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((d.error && d.error.message) || ("HTTP " + res.status));
    await tick();
  } catch (e) {
    alert("切换失败: " + e.message);
  } finally {
    if (cb) cb.disabled = false;
  }
}

async function refreshAllAccounts() {
  const btn = $("refresh-all-btn"), msg = $("refresh-all-msg");
  btn.disabled = true; msg.textContent = "正在刷新全部令牌…";
  try {
    const res = await fetch("/api/accounts/refresh", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({})
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((d.error && d.error.message) || ("HTTP " + res.status));
    const failed = (d.results || []).filter(r => !r.ok);
    msg.innerHTML = failed.length
      ? `<span class="err-box">已刷新 ${d.refreshed}/${d.total}，${failed.length} 个失败</span>`
      : `已刷新全部 ${d.refreshed} 个账号。`;
    await tick();
  } catch (e) {
    msg.innerHTML = `<span class="err-box">刷新失败: ${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
}

// exportAccounts downloads the full pool (secrets included) as a JSON file.
// Fetched via XHR so a failed export surfaces an error instead of navigating
// away; the blob is then saved through a synthetic <a download>.
async function exportAccounts() {
  const btn = $("export-btn"), msg = $("refresh-all-msg");
  btn.disabled = true;
  try {
    const res = await fetch("/api/accounts/export", { cache: "no-store" });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error((d.error && d.error.message) || ("HTTP " + res.status)); }
    const blob = await res.blob();
    const ts = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, "");
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `kiro-anthropic-accounts-${ts}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    msg.textContent = "已导出号池凭据（含密钥，请妥善保管）。";
  } catch (e) {
    msg.innerHTML = `<span class="err-box">导出失败: ${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
}

// importBundle merges an exported bundle into the pool. It parses the file
// client-side first for a friendly error, then posts the raw text.
async function importBundle(file) {
  if (!file) return;
  const msg = $("refresh-all-msg");
  msg.textContent = "正在导入号池…";
  try {
    const text = await file.text();
    JSON.parse(text); // fail fast on a non-JSON file
    const res = await fetch("/api/accounts/import-bundle", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: text
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((d.error && d.error.message) || ("HTTP " + res.status));
    msg.textContent = `导入完成：新增 ${d.added}，更新 ${d.replaced}（共 ${d.total}）。`;
    await tick();
  } catch (e) {
    msg.innerHTML = `<span class="err-box">导入失败: ${esc(e.message)}</span>`;
  }
}

async function tick() {
  // On the very first load, paint a skeleton + loading bar immediately so the
  // panel is never blank while usage is fetched. Subsequent (background) polls
  // keep showing the previous data and only touch the bar on error.
  if (!loaded) { renderSkeleton(); setStatusBar("正在加载账号额度…"); }
  try {
    const res = await fetch("/api/status.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    $("ver").textContent = d.version
      ? (d.version.startsWith("v") ? d.version : "v" + d.version)
      : "";
    latestModels = d.models || [];
    renderAccounts(d.accounts);
    $("updated").textContent = "更新于 " + new Date().toLocaleTimeString();
    loaded = true;
    setStatusBar("");
  } catch (e) {
    if (!loaded) {
      // first load failed: surface the error in the bar, leave the skeleton.
      setStatusBar("加载失败：" + e.message, true);
    } else {
      // background refresh failed: keep the last good data, just note it.
      setStatusBar("刷新失败：" + e.message, true);
      setTimeout(() => { if (loaded) setStatusBar(""); }, 4000);
    }
    $("updated").innerHTML = `<span class="err-box">刷新失败: ${esc(e.message)}</span>`;
  }
}

$("login-btn").addEventListener("click", startLogin);
$("import-btn").addEventListener("click", importLocal);
$("refresh-all-btn").addEventListener("click", refreshAllAccounts);
$("export-btn").addEventListener("click", exportAccounts);
$("import-file-btn").addEventListener("click", () => $("import-file-input").click());
$("import-file-input").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  importBundle(f);
  e.target.value = ""; // let the same file be re-selected later
});
$("models-close").addEventListener("click", () => $("models-modal").classList.remove("open"));
$("models-modal").addEventListener("click", (e) => { if (e.target === $("models-modal")) $("models-modal").classList.remove("open"); });
$("update-close").addEventListener("click", () => $("update-modal").classList.remove("open"));
$("update-modal").addEventListener("click", (e) => { if (e.target === $("update-modal")) $("update-modal").classList.remove("open"); });
// Re-check when the tab becomes visible again, but not more often than the cadence.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && Date.now() - lastUpdateCheck > UPDATE_CHECK_MS) checkUpdate();
});
tick();
setInterval(tick, REFRESH_MS);
checkUpdate();
setInterval(checkUpdate, UPDATE_CHECK_MS);
</script>
</body>
</html>
