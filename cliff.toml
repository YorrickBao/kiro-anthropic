# git-cliff 配置 —— https://git-cliff.org/docs/configuration
# 依据 Conventional Commits 从 git 历史生成分组的 changelog / release notes。

[changelog]
# changelog 顶部标题；发布说明里用 `--strip header` 去掉这部分。
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""
# 每个版本区块的模板（Tera 语法）。缩进与行尾的反斜杠用于控制空白，勿随意改动。
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
# 去掉 body 首尾多余空白。
trim = true
footer = ""

[git]
# 按 Conventional Commits 规范解析提交。
conventional_commits = true
# 过滤掉不符合规范的提交，让发布说明保持干净。
# 想把所有提交（包括不规范的）都列出来，把这里改成 false。
filter_unconventional = true
split_commits = false
# 预处理：移除提交标题里形如 (#123) 的 PR 编号。
commit_preprocessors = [
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
# 提交类型 -> 展示分组。<!-- N --> 前缀只用于控制排序，striptags 会在标题里去掉它。
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->⛰️  Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 3 -->🚜 Refactor" },
    { message = "^doc", group = "<!-- 4 -->📚 Documentation" },
    { message = "^test", group = "<!-- 5 -->🧪 Testing" },
    { message = "^style", group = "<!-- 6 -->🎨 Styling" },
    { message = "^chore\\(release\\): prepare for", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    # 仓库维护噪声（gitignore、编辑器配置等）不进面向用户的 release notes。
    { message = "^chore\\(repo\\)", skip = true },
    { message = "^chore|^ci|^build", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
    { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
    { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
]
# 带 `!` 或页脚 `BREAKING CHANGE:` 的提交会被标记为破坏性变更（加 [**breaking**] 前缀）。
protect_breaking_commits = false
filter_commits = false
# 只把形如 v1.2.3 的 tag 视为版本。
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
